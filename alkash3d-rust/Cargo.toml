[package]
name = "alkash3d_rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# ИСПРАВЛЕНО: раньше здесь был ОДИН [[bin]] с именем "tests" и ключами
# path2/path3 — Cargo не поддерживает такие ключи (см. предупреждения
# "unused manifest key: bin.0.path2/path3" при сборке), поэтому реально
# собирался ТОЛЬКО src/bin/main.rs под именем "tests"; main1.rs и main2.rs
# никогда не компилировались как отдельные бинарники. Теперь каждый demo —
# свой [[bin]] с собственным именем: `cargo run --bin main` (ходьба по
# плиткам + ночные фонари), `cargo run --bin main1` (солнечная система),
# `cargo run --bin main2` (простые летающие кубы). Это и есть стандартный
# способ Cargo объявлять несколько бинарников в одном пакете — по факту
# Cargo и сам бы нашёл все три файла в src/bin/ автоматически даже без этих
# секций (используя имя файла как имя бинарника), но явные секции понятнее
# читать и не зависят от неявного поведения.
[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "main1"
path = "src/bin/main1.rs"

[[bin]]
name = "main2"
path = "src/bin/main2.rs"


[dependencies]
# ДОБАВЛЕНО (звуковая подсистема — XAudio2): "Win32_Media_Audio_XAudio2"
# тянет за собой "Win32_Media_Audio" (см. windows-0.62.2/Cargo.toml —
# Win32_Media_Audio_XAudio2 = ["Win32_Media_Audio"]), которая, в свою
# очередь, даёт WAVEFORMATEX и остальные общие Media::Audio типы.
# XAudio2 в этой версии крейта линкуется статически против "xaudio2_8.dll"
# (см. windows-0.62.2/src/.../XAudio2/mod.rs — XAudio2CreateWithVersionInfo
# использует windows_core::link!("xaudio2_8.dll" ...)) — версия 2.8 API
# ВСТРОЕНА в саму ОС начиная с Windows 8 (часть XAudio2Redist слился в
# системный компонент), никакого отдельного redist/vcredist не требуется
# — то, что нужно под цель "10 лет минимального железа" из ТЗ движка.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Graphics_Dxgi_Common", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio_XAudio2", "Win32_Media_Audio", "Win32_Media_Multimedia"] }
widestring = "1.0"
windows-core = "0.62.2"
winit = "0.31.0-beta.2"
env_logger = "0.11.10"
libloading = "0.9.0"
bytemuck = { version = "1.14", features = ["derive"] }
num_cpus = "1.16"
crossbeam-channel = "0.5"
rayon = "1.8"
sysinfo = "0.39.3"
rand = "0.10.1"
glam = "0.33.2"
nalgebra = "0.35.0"
# ДОБАВЛЕНО (скриптинг, вторая волна — Python как hot-reload): чистый
# Rust, никаких системных зависимостей (в отличие от pyo3, требующего
# embeddable CPython, установленный на машине сборки/игрока) — см.
# подробное обоснование в engine/scripting_python.rs. rustpython-stdlib
# нужна отдельно от rustpython-vm — сам движок VM не включает модули
# стандартной библиотеки (в т.ч. `math`, нужный примеру bobber.py).
rustpython-vm = "0.4"
rustpython-stdlib = "0.4"

[profile.release]
opt-level = 3
lto = true
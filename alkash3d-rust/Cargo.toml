[package]
name = "alkash3d_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "triangle_demo"
path = "src/bin/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Graphics_Dxgi_Common"
] }
widestring = "1.0"
windows-core = "0.62.2"
winit = "0.31.0-beta.2"
env_logger = "0.11.10"
libloading = "0.9.0"
bytemuck = { version = "1.14", features = ["derive"] }
num_cpus = "1.16"
crossbeam-channel = "0.5"
rayon = "1.8"
sysinfo = "0.39.3"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
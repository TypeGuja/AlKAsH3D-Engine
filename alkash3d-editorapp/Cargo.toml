[package]
name = "alkash3d-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wgpu"]}
egui = "0.31"
egui-wgpu = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rfd = "0.17.2"
tobj = "4.0"
which = "8.0.2"
rand = "0.10.1"
rayon = "1.12.0"
wgpu = "27.0.0"
winit = "0.30.13"
bytemuck = { version = "1", features = ["derive"] }
lru = "0.18.0"
# ДОБАВЛЕНО (текстуры материалов — по прямому запросу пользователя:
# "добавь altex чтобы можно было загружать текстуру предмета картинкой"):
# декодирование произвольных файлов изображений в сырые RGBA8-пиксели для
# `material::TextureAsset` — тот же формат байт, что уже ожидает
# `AltexFile::add_texture` в движке (см. alkash3d-rust/src/altex_format.rs).
# Уже присутствовал ТРАНЗИТИВНО через `egui_extras`'ю feature "image" (см.
# Cargo.lock — версия 0.25.10), здесь добавлен ПРЯМОЙ зависимостью с той же
# версией — эдитору нужен сам API декодирования (`image::open`/`to_rgba8`).
# `default-features = false` + явный список форматов — дефолтные фичи
# `image` тянут ещё и avif (через `ravif`/`rav1e`, тяжёлый AV1-энкодер),
# exr/hdr/qoi/pnm/dds/ico, которые для обычных игровых текстур не нужны и
# ощутимо раздувают время сборки; оставлен тот же набор форматов, что уже
# заявлен в фильтре диалога выбора файла (`ui/inspector.rs`/
# `ui/material_library_editor.rs`: "Images" — png/jpg/jpeg/bmp/tga/gif/webp).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tga", "webp"] }
# ДОБАВЛЕНО (по прямому запросу пользователя: "Discord Rich Presence
# статус"): IPC-клиент к локальному десктоп-приложению Discord — см.
# src/discord_presence.rs. Не имеет отношения к настоящему игровому
# оверлею Discord (чат/войс-панель поверх окна) — тот включается только
# настройками самого клиента Discord, кода не требует в принципе.
discord-rich-presence = "0.2"
# ДОБАВЛЕНО (полноценный эдитор — конвертация/сохранение в родные форматы
# движка): раньше эдитор ссылался на alkash3d_rs только косвенно, через
# скомпилированный alkash3d_rs.dll (см. build.rs — тот поиск нужен для
# alkash3d-execfile / capi.rs, C-ABI слоя). Настоящие *_format.rs структуры
# (AltexFile/AlworldFile/AlfarFile/...) в этот DLL не экспортированы (они не
# часть C-ABI) и были недостижимы для эдитора. alkash3d_rs собирается с
# crate-type = ["cdylib", "rlib"] — rlib как раз позволяет использовать его
# как обычную Rust-библиотеку через path-зависимость, без FFI, с прямым
# доступом к тем же save()/load(), что использует сам движок — гарантирует,
# что файлы, записанные эдитором, побайтово совместимы с тем, что движок
# реально прочитает.
alkash3d_rs = { path = "../alkash3d-rust" }
[build-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[lib]
name = "alkash3d_editor"
path = "src/lib.rs"

[[bin]]
name = "alkash3d-editor"
path = "src/main.rs"
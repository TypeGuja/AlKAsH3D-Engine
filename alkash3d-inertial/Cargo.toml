[package]
name = "inertial"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# ПРИМЕЧАНИЕ: оригинального Cargo.toml мне не присылали — этот файл
# восстановлен по структуре исходников (src/lib.rs, src/ffi/mod.rs,
# build.rs) и требованиям build.rs. Если у тебя уже есть свой Cargo.toml
# с дополнительными зависимостями/фичами — просто перенеси секцию
# [lib]/[profile.release] и build.rs-специфичные настройки, не затирая
# остальное.

[lib]
name = "inertial"
# cdylib — обязательно: это то, что становится inertial.dll и грузится
# движком через libloading (PluginManager::load_plugin).
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

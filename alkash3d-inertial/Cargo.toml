[package]
name = "alkash3d-inertial"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
nalgebra = "0.32"
rayon = "1.8"

[build-dependencies]
cc = "1.0"
which = "8.0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
incremental = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
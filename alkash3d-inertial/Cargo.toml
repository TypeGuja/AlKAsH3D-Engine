[package]
name = "alkash3d-inertial"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
nalgebra = "0.32"
rayon = "1.8"
criterion = "0.8.2"

[build-dependencies]
cc = "1.0"
which = "8.0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
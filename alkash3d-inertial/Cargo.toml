[package]
name = "inertial"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "inertial"
# "cdylib" — для движка (LoadLibrary/libloading). "rlib" — чтобы
# examples/perf_test.rs мог линковаться с крейтом как с обычной Rust-
# библиотекой (use inertial::{...}). Оба собираются одновременно из
# одного и того же кода — движок как грузил, так и продолжает грузить
# именно .dll/.so, ничего в этом плане не меняется.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
